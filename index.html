<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stepwise — Notes</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script>
    // Site code is tiny; always fetch it fresh so a new note never runs against stale code.
    document.write('<link rel="stylesheet" href="assets/style.css?v=' + Date.now() + '">');
  </script>
</head>
<body>
  <header class="topbar">
    <button id="menu-toggle" aria-label="Toggle navigation" aria-controls="sidebar" aria-expanded="false">☰</button>
    <a href="#/" class="brand">Stepwise</a>
  </header>

  <aside id="sidebar">
    <a href="#/" class="brand sidebar-brand">Stepwise</a>
    <nav id="nav" aria-label="Notes"></nav>
  </aside>

  <main id="content">
    <article id="note" class="note"></article>
    <nav id="pager" class="pager" aria-label="Previous and next note"></nav>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script>document.write('<script src="assets/app.js?v=' + Date.now() + '"><\/script>');</script>
</body>
</html>
