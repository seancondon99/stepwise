<text x="380.0" y="324.5" text-anchor="middle" class="small cell-click-text">l₃</text>
<rect class="cell" x="407.0" y="307.0" width="26" height="26" rx="5"/>
<text x="420.0" y="324.5" text-anchor="middle" class="small muted">l₄</text>
<rect class="cell-click" x="447.0" y="307.0" width="26" height="26" rx="5"/>
<text x="460.0" y="324.5" text-anchor="middle" class="small cell-click-text">l₅</text>
<rect class="cell" x="487.0" y="307.0" width="26" height="26" rx="5"/>
<text x="500.0" y="324.5" text-anchor="middle" class="small muted">l₆</text>
<rect class="cell" x="527.0" y="307.0" width="26" height="26" rx="5"/>
<text x="540.0" y="324.5" text-anchor="middle" class="small muted">l₇</text>
<path class="arc s2" d="M376,306.0 Q360.0,281.0 344,306.0" marker-end="url(#pref)"/>
<path class="arc s2" d="M456,306.0 Q440.0,281.0 424,306.0" marker-end="url(#pref)"/>
<text x="574.0" y="316.0" text-anchor="start" class="small k-int">the abstract right above</text>
<text x="574.0" y="333.0" text-anchor="start" class="small k-int">a click is almost always read</text>
<text x="10.0" y="396.0" text-anchor="start" class="small title">5  Click &gt; No-Click Next</text>
<text x="10.0" y="413.0" text-anchor="start" class="small muted">click beats the unclicked link just below</text>
<rect class="cell-click" x="287.0" y="387.0" width="26" height="26" rx="5"/>
