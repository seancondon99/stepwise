<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="Preferences each of the five strategies extracts from clicks on l1, l3 and l5: arcs go from the preferred doc to the doc it beats">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #1f2328; }
  .muted { fill: #6b7280; }
  .small { font-size: 12px; }
  .title { font-weight: 600; }
  .axis { stroke: #9ca3af; stroke-width: 1; fill: none; }
  .grid { stroke: #ececea; stroke-width: 1; fill: none; }
  .s1 { stroke: #2f6fdb; } .f1 { fill: #2f6fdb; }
  .s2 { stroke: #d9822b; } .f2 { fill: #d9822b; }
  .s3 { stroke: #2e9e6a; } .f3 { fill: #2e9e6a; }
  .s4 { stroke: #b0398f; } .f4 { fill: #b0398f; }
  .line { fill: none; stroke-width: 2.25; stroke-linejoin: round; stroke-linecap: round; }
  .dash { stroke-dasharray: 6 5; }
  .ref { stroke: #6b7280; stroke-width: 1.25; stroke-dasharray: 4 4; fill: none; }
  .shade { fill: #d0453a; opacity: 0.08; }
  .node { fill: #ffffff; stroke: #1f2328; stroke-width: 1.5; }
  .hidden { fill: #e9effb; }
  .arrow { stroke: #1f2328; stroke-width: 1.5; fill: none; }
  .ahead { fill: #1f2328; }
  .plate { fill: none; stroke: #9ca3af; stroke-width: 1.25; stroke-dasharray: 6 4; }
  .legend-bg { fill: #fdfdfc; opacity: 0.9; }
  @media (prefers-color-scheme: dark) {
    text { fill: #e6e6e3; }
    .muted { fill: #9aa0a8; }
    .axis { stroke: #6b7280; }
    .grid { stroke: #2a2e34; }
    .s1 { stroke: #7aa7ff; } .f1 { fill: #7aa7ff; }
    .s2 { stroke: #f0a35e; } .f2 { fill: #f0a35e; }
    .s3 { stroke: #5cc495; } .f3 { fill: #5cc495; }
    .s4 { stroke: #e07cc4; } .f4 { fill: #e07cc4; }
    .ref { stroke: #9aa0a8; }
    .shade { fill: #ff6b5e; opacity: 0.1; }
    .node { fill: #1d2025; stroke: #e6e6e3; }
    .hidden { fill: #263450; }
    .arrow { stroke: #e6e6e3; }
    .ahead { fill: #e6e6e3; }
    .legend-bg { fill: #16181c; }
  }

  .cell { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.25; }
  .cell-click { fill: #2f6fdb; stroke: #2f6fdb; stroke-width: 1.25; }
  .cell-click-text { fill: #ffffff; font-weight: 600; }
  .hm { fill: #2f6fdb; }
  .hm-diag { fill: none; stroke: #1f2328; stroke-width: 1.5; }
  .hm-strong { fill: #ffffff; }
  .arc { fill: none; stroke-width: 1.75; }
  @media (prefers-color-scheme: dark) {
    .cell { fill: #1d2025; stroke: #6b7280; }
    .cell-click { fill: #7aa7ff; stroke: #7aa7ff; }
    .cell-click-text { fill: #16181c; }
    .hm { fill: #7aa7ff; }
    .hm-diag { stroke: #e6e6e3; }
    .hm-strong { fill: #16181c; }
  }

  .k-int { fill: #23845a; } .k-ass { fill: #c02a8c; } .k-prob { fill: #c8372d; }
  @media (prefers-color-scheme: dark) {
    .k-int { fill: #5cc495; } .k-ass { fill: #ec7cc6; } .k-prob { fill: #ff7f74; }
  }
</style>
<defs><marker id="pref" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="f2" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<text x="420.0" y="18.0" text-anchor="middle" class="muted small">clicks on l₁, l₃, l₅  (in that order)</text>
<text x="574.0" y="18.0" text-anchor="start" class="muted small">why</text>
<text x="10.0" y="76.0" text-anchor="start" class="small title">1  Click &gt; Skip Above</text>
<text x="10.0" y="93.0" text-anchor="start" class="small muted">click beats skipped links above it</text>
<rect class="cell-click" x="287.0" y="67.0" width="26" height="26" rx="5"/>
<text x="300.0" y="84.5" text-anchor="middle" class="small cell-click-text">l₁</text>
<rect class="cell" x="327.0" y="67.0" width="26" height="26" rx="5"/>
<text x="340.0" y="84.5" text-anchor="middle" class="small muted">l₂</text>
<rect class="cell-click" x="367.0" y="67.0" width="26" height="26" rx="5"/>
<text x="380.0" y="84.5" text-anchor="middle" class="small cell-click-text">l₃</text>
<rect class="cell" x="407.0" y="67.0" width="26" height="26" rx="5"/>
<text x="420.0" y="84.5" text-anchor="middle" class="small muted">l₄</text>
<rect class="cell-click" x="447.0" y="67.0" width="26" height="26" rx="5"/>
<text x="460.0" y="84.5" text-anchor="middle" class="small cell-click-text">l₅</text>
<rect class="cell" x="487.0" y="67.0" width="26" height="26" rx="5"/>
<text x="500.0" y="84.5" text-anchor="middle" class="small muted">l₆</text>
<rect class="cell" x="527.0" y="67.0" width="26" height="26" rx="5"/>
<text x="540.0" y="84.5" text-anchor="middle" class="small muted">l₇</text>
<path class="arc s2" d="M376,66.0 Q360.0,41.0 344,66.0" marker-end="url(#pref)"/>
<path class="arc s2" d="M456,66.0 Q400.0,17.0 344,66.0" marker-end="url(#pref)"/>
<path class="arc s2" d="M456,66.0 Q440.0,41.0 424,66.0" marker-end="url(#pref)"/>
<text x="574.0" y="76.0" text-anchor="start" class="small k-int">skipping a higher link =</text>
<text x="574.0" y="93.0" text-anchor="start" class="small k-int">overriding the ranking</text>
<text x="10.0" y="156.0" text-anchor="start" class="small title">2  Last Click &gt; Skip Above</text>
<text x="10.0" y="173.0" text-anchor="start" class="small muted">same, but only the last click</text>
<rect class="cell-click" x="287.0" y="147.0" width="26" height="26" rx="5"/>
<text x="300.0" y="164.5" text-anchor="middle" class="small cell-click-text">l₁</text>
<rect class="cell" x="327.0" y="147.0" width="26" height="26" rx="5"/>
<text x="340.0" y="164.5" text-anchor="middle" class="small muted">l₂</text>
<rect class="cell-click" x="367.0" y="147.0" width="26" height="26" rx="5"/>
<text x="380.0" y="164.5" text-anchor="middle" class="small cell-click-text">l₃</text>
<rect class="cell" x="407.0" y="147.0" width="26" height="26" rx="5"/>
<text x="420.0" y="164.5" text-anchor="middle" class="small muted">l₄</text>
