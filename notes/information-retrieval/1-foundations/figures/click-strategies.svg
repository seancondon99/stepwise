<text x="460.0" y="164.5" text-anchor="middle" class="small cell-click-text">l₅</text>
<rect class="cell" x="487.0" y="147.0" width="26" height="26" rx="5"/>
<text x="500.0" y="164.5" text-anchor="middle" class="small muted">l₆</text>
<rect class="cell" x="527.0" y="147.0" width="26" height="26" rx="5"/>
<text x="540.0" y="164.5" text-anchor="middle" class="small muted">l₇</text>
<path class="arc s2" d="M456,146.0 Q400.0,97.0 344,146.0" marker-end="url(#pref)"/>
<path class="arc s2" d="M456,146.0 Q440.0,121.0 424,146.0" marker-end="url(#pref)"/>
<text x="574.0" y="156.0" text-anchor="start" class="small k-int">earlier clicks were</text>
<text x="574.0" y="173.0" text-anchor="start" class="small k-int">less informed</text>
<text x="10.0" y="236.0" text-anchor="start" class="small title">3  Click &gt; Earlier Click</text>
<text x="10.0" y="253.0" text-anchor="start" class="small muted">later click beats earlier click</text>
<rect class="cell-click" x="287.0" y="227.0" width="26" height="26" rx="5"/>
<text x="300.0" y="244.5" text-anchor="middle" class="small cell-click-text">l₁</text>
<rect class="cell" x="327.0" y="227.0" width="26" height="26" rx="5"/>
<text x="340.0" y="244.5" text-anchor="middle" class="small muted">l₂</text>
<rect class="cell-click" x="367.0" y="227.0" width="26" height="26" rx="5"/>
<text x="380.0" y="244.5" text-anchor="middle" class="small cell-click-text">l₃</text>
<rect class="cell" x="407.0" y="227.0" width="26" height="26" rx="5"/>
<text x="420.0" y="244.5" text-anchor="middle" class="small muted">l₄</text>
<rect class="cell-click" x="447.0" y="227.0" width="26" height="26" rx="5"/>
<text x="460.0" y="244.5" text-anchor="middle" class="small cell-click-text">l₅</text>
<rect class="cell" x="487.0" y="227.0" width="26" height="26" rx="5"/>
<text x="500.0" y="244.5" text-anchor="middle" class="small muted">l₆</text>
<rect class="cell" x="527.0" y="227.0" width="26" height="26" rx="5"/>
<text x="540.0" y="244.5" text-anchor="middle" class="small muted">l₇</text>
<path class="arc s2" d="M376,226.0 Q340.0,189.0 304,226.0" marker-end="url(#pref)"/>
<path class="arc s2" d="M456,226.0 Q380.0,165.0 304,226.0" marker-end="url(#pref)"/>
<path class="arc s2" d="M456,226.0 Q420.0,189.0 384,226.0" marker-end="url(#pref)"/>
<text x="574.0" y="236.0" text-anchor="start" class="small k-ass">assumes later clicks</text>
<text x="574.0" y="253.0" text-anchor="start" class="small k-ass">are more relevant</text>
<text x="10.0" y="316.0" text-anchor="start" class="small title">4  Click &gt; Skip Previous</text>
<text x="10.0" y="333.0" text-anchor="start" class="small muted">click beats the skipped link just above</text>
<rect class="cell-click" x="287.0" y="307.0" width="26" height="26" rx="5"/>
