<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360" role="img" aria-label="Per-document forces for the same ranking: RankNet spreads the push evenly over all pairs; LambdaRank concentrates it at the top">
<style>
