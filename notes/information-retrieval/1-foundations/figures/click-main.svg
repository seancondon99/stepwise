<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 104" width="600" height="104" role="img" aria-label="Click beats skip above: clicks on l1, l3, l5 give l3 over l2, l5 over l2, l5 over l4">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #1f2328; }
  .muted { fill: #6b7280; }
  .small { font-size: 12px; }
  .title { font-weight: 600; }
  .axis { stroke: #9ca3af; stroke-width: 1; fill: none; }
  .grid { stroke: #ececea; stroke-width: 1; fill: none; }
  .s1 { stroke: #2f6fdb; } .f1 { fill: #2f6fdb; }
  .s2 { stroke: #d9822b; } .f2 { fill: #d9822b; }
  .s3 { stroke: #2e9e6a; } .f3 { fill: #2e9e6a; }
  .s4 { stroke: #b0398f; } .f4 { fill: #b0398f; }
  .line { fill: none; stroke-width: 2.25; stroke-linejoin: round; stroke-linecap: round; }
  .dash { stroke-dasharray: 6 5; }
  .ref { stroke: #6b7280; stroke-width: 1.25; stroke-dasharray: 4 4; fill: none; }
  .shade { fill: #d0453a; opacity: 0.08; }
  .node { fill: #ffffff; stroke: #1f2328; stroke-width: 1.5; }
  .hidden { fill: #e9effb; }
  .arrow { stroke: #1f2328; stroke-width: 1.5; fill: none; }
  .ahead { fill: #1f2328; }
  .plate { fill: none; stroke: #9ca3af; stroke-width: 1.25; stroke-dasharray: 6 4; }
  .legend-bg { fill: #fdfdfc; opacity: 0.9; }
  @media (prefers-color-scheme: dark) {
    text { fill: #e6e6e3; }
    .muted { fill: #9aa0a8; }
    .axis { stroke: #6b7280; }
    .grid { stroke: #2a2e34; }
    .s1 { stroke: #7aa7ff; } .f1 { fill: #7aa7ff; }
    .s2 { stroke: #f0a35e; } .f2 { fill: #f0a35e; }
    .s3 { stroke: #5cc495; } .f3 { fill: #5cc495; }
    .s4 { stroke: #e07cc4; } .f4 { fill: #e07cc4; }
    .ref { stroke: #9aa0a8; }
    .shade { fill: #ff6b5e; opacity: 0.1; }
    .node { fill: #1d2025; stroke: #e6e6e3; }
    .hidden { fill: #263450; }
    .arrow { stroke: #e6e6e3; }
    .ahead { fill: #e6e6e3; }
    .legend-bg { fill: #16181c; }
  }

  .cell { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.25; }
  .cell-click { fill: #2f6fdb; stroke: #2f6fdb; stroke-width: 1.25; }
  .cell-click-text { fill: #ffffff; font-weight: 600; }
  .hm { fill: #2f6fdb; }
  .hm-diag { fill: none; stroke: #1f2328; stroke-width: 1.5; }
  .hm-strong { fill: #ffffff; }
  .arc { fill: none; stroke-width: 1.75; }
  @media (prefers-color-scheme: dark) {
    .cell { fill: #1d2025; stroke: #6b7280; }
    .cell-click { fill: #7aa7ff; stroke: #7aa7ff; }
    .cell-click-text { fill: #16181c; }
    .hm { fill: #7aa7ff; }
    .hm-diag { stroke: #e6e6e3; }
    .hm-strong { fill: #16181c; }
  }

  .k-int { fill: #23845a; } .k-ass { fill: #c02a8c; } .k-prob { fill: #c8372d; }
  @media (prefers-color-scheme: dark) {
    .k-int { fill: #5cc495; } .k-ass { fill: #ec7cc6; } .k-prob { fill: #ff7f74; }
  }
</style>
<defs><marker id="pref" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="f2" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<rect class="cell-click" x="47.0" y="51.0" width="26" height="26" rx="5"/>
<text x="60.0" y="68.5" text-anchor="middle" class="small cell-click-text">l₁</text>
<rect class="cell" x="91.0" y="51.0" width="26" height="26" rx="5"/>
<text x="104.0" y="68.5" text-anchor="middle" class="small muted">l₂</text>
<rect class="cell-click" x="135.0" y="51.0" width="26" height="26" rx="5"/>
<text x="148.0" y="68.5" text-anchor="middle" class="small cell-click-text">l₃</text>
<rect class="cell" x="179.0" y="51.0" width="26" height="26" rx="5"/>
<text x="192.0" y="68.5" text-anchor="middle" class="small muted">l₄</text>
<rect class="cell-click" x="223.0" y="51.0" width="26" height="26" rx="5"/>
<text x="236.0" y="68.5" text-anchor="middle" class="small cell-click-text">l₅</text>
<rect class="cell" x="267.0" y="51.0" width="26" height="26" rx="5"/>
<text x="280.0" y="68.5" text-anchor="middle" class="small muted">l₆</text>
<rect class="cell" x="311.0" y="51.0" width="26" height="26" rx="5"/>
<text x="324.0" y="68.5" text-anchor="middle" class="small muted">l₇</text>
<path class="arc s2" d="M144,50.0 Q126.0,25.0 108,50.0" marker-end="url(#pref)"/>
<path class="arc s2" d="M232,50.0 Q170.0,1.0 108,50.0" marker-end="url(#pref)"/>
<path class="arc s2" d="M232,50.0 Q214.0,25.0 196,50.0" marker-end="url(#pref)"/>
<text x="364.0" y="52.0" text-anchor="start" class="title">a click beats every link the user</text>
<text x="364.0" y="72.0" text-anchor="start" class="title">skipped over above it</text>
<text x="364.0" y="96.0" text-anchor="start" class="muted small">l₃ &gt; l₂,  l₅ &gt; l₂,  l₅ &gt; l₄</text>
</svg>
